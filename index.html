<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet detector</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
      }

      #app {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px;
      }

      #status {
        margin-bottom: 12px;
      }

      #camera-wrapper {
        position: relative;
        width: min(100%, 960px);
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #333;
        background: #000;
      }

      #camera-feed,
      #overlay {
        display: block;
        width: 100%;
        height: auto;
        max-height: 75vh;
        object-fit: cover;
      }

      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p id="status">กำลังโหลด OpenCV.js...</p>
      <div id="camera-wrapper">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>

    <script>
      // OpenCV.js เรียกฟังก์ชันนี้เมื่อ runtime พร้อมใช้งาน
      var Module = {
        onRuntimeInitialized() {
          window.dispatchEvent(new Event("opencv-ready"));
        }
      };
    </script>
    <script async src="./opencv.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
